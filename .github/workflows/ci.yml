name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # The shared core library (volodya4u/core) is not published to a Maven
      # repository, so build it and install it into the local one first.
      - name: Check out core library
        uses: actions/checkout@v7
        with:
          repository: volodya4u/core
          path: .core

      - name: Install core library
        run: mvn -B -ntp install -DskipTests -f .core/pom.xml

      - name: Build and test
        run: mvn -B -ntp verify

  # Runs the packaged service against a real Kafka broker: it must create its
  # topic on startup, and POST /products must publish a ProductCreatedEvent keyed
  # by the product ID, with a messageId header.
  smoke-test:
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      kafka:
        image: apache/kafka:4.2.1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Check out core library
        uses: actions/checkout@v7
        with:
          repository: volodya4u/core
          path: .core

      - name: Install core library
        run: mvn -B -ntp install -DskipTests -f .core/pom.xml

      - name: Package
        run: mvn -B -ntp package -DskipTests

      # A single broker, so the topic gets one replica.
      - name: Start service
        run: |
          nohup java -jar target/*.jar --server.port=8080 \
            --spring.kafka.producer.bootstrap-servers=localhost:9092 \
            --app.kafka.topic.replicas=1 --app.kafka.topic.min-insync-replicas=1 \
            > service.log 2>&1 &
          timeout 120 bash -c 'until grep -q "Started ProductsMicroserviceApplication" service.log; do sleep 2; done'

      - name: Create a product
        run: |
          product_id=$(curl -sS --fail-with-body -H 'Content-Type: application/json' \
            -d '{"title":"Smoke test product","price":10.5,"quantity":2}' \
            http://localhost:8080/products)
          echo "Created product $product_id"
          echo "PRODUCT_ID=$product_id" >> "$GITHUB_ENV"

      - name: Check that the service created the topic
        run: |
          docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server localhost:9092 --describe --topic product-created-events-topic |
            tee topic.txt
          grep -q "PartitionCount: 3" topic.txt

      # The consumer prints: headers, key, value (tab-separated).
      - name: Check the published event
        run: |
          docker exec ${{ job.services.kafka.id }} /opt/kafka/bin/kafka-console-consumer.sh \
            --bootstrap-server localhost:9092 --topic product-created-events-topic \
            --from-beginning --max-messages 1 --timeout-ms 30000 \
            --formatter-property print.key=true --formatter-property print.headers=true |
            tee event.txt
          grep -q "messageId:" event.txt
          grep -q "__TypeId__:com.appsdeveloperblog.ws.core.events.ProductCreatedEvent" event.txt
          awk -F '\t' -v id="$PRODUCT_ID" '$2 == id' event.txt | grep -q .
          grep -qF '"title":"Smoke test product"' event.txt

      - name: Show service log
        if: always()
        run: cat service.log || true

  # Merge Dependabot's patch and minor updates once build-and-test and the Kafka
  # smoke test have passed. Docker image updates and minor Spring Boot parent
  # updates are left for review.
  dependabot-auto-merge:
    needs: [build-and-test, smoke-test]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge patch and minor updates
        if: >-
          steps.meta.outputs.package-ecosystem != 'docker' &&
          (steps.meta.outputs.update-type == 'version-update:semver-patch' ||
           (steps.meta.outputs.update-type == 'version-update:semver-minor' &&
            !contains(steps.meta.outputs.dependency-names, 'spring-boot-starter-parent')))
        run: gh pr merge --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
